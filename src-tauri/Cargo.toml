[package]
name = "notelm-spike"
version = "0.1.0"
description = "note-lm packaging spike: Tauri window + local Node engine over stdio"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
