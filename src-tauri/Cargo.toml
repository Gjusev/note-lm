[package]
name = "notelm-spike"
version = "0.1.0"
description = "note-lm packaging spike: Tauri window + local Node engine over stdio"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Connection secrets (multi-provider S2): service "note-lm", entry per
# connection id. The keyring v3 crate gates platform backends behind
# features - enable one per supported target.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[profile.release]
strip = true
lto = true
