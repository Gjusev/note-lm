<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="note-lm – Forschungsnotizbuch mit Belegen">
  <!-- Docs/design cover, neo-brutalist: visible hairline column grid,
       2px structural rules, oversized heavy caps, mono metadata (index
       numeral + version tick), red as the single hard accent.
       No gradients, no shadows, no pastels. Hand-authored vector. -->
  <rect width="1200" height="675" fill="#F7F6F3"/>

  <!-- hairline column grid: 12 columns between the margins, 1px #EAEAEA -->
  <g stroke="#EAEAEA" stroke-width="1">
    <line x1="96" y1="72" x2="96" y2="603"/>
    <line x1="173.33" y1="72" x2="173.33" y2="603"/>
    <line x1="250.67" y1="72" x2="250.67" y2="603"/>
    <line x1="328" y1="72" x2="328" y2="603"/>
    <line x1="405.33" y1="72" x2="405.33" y2="603"/>
    <line x1="482.67" y1="72" x2="482.67" y2="603"/>
    <line x1="560" y1="72" x2="560" y2="603"/>
    <line x1="637.33" y1="72" x2="637.33" y2="603"/>
    <line x1="714.67" y1="72" x2="714.67" y2="603"/>
    <line x1="792" y1="72" x2="792" y2="603"/>
    <line x1="869.33" y1="72" x2="869.33" y2="603"/>
    <line x1="946.67" y1="72" x2="946.67" y2="603"/>
    <line x1="1024" y1="72" x2="1024" y2="603"/>
    <line x1="1104" y1="72" x2="1104" y2="603"/>
  </g>

  <!-- structural rules (2px ink) -->
  <line x1="96" y1="72" x2="1104" y2="72" stroke="#202020" stroke-width="2"/>
  <line x1="96" y1="603" x2="1104" y2="603" stroke="#202020" stroke-width="2"/>
  <line x1="96" y1="470" x2="1104" y2="470" stroke="#202020" stroke-width="2"/>

  <!-- mark: left edge snapped to the margin rule (x=96), bottom edge on the
       wordmark baseline (y=286) -->
  <g transform="translate(60,160) scale(4.5)">
    <path d="M8 4H17l7 7V28H8Z" fill="#202020"/>
    <rect x="11" y="12" width="10" height="3" fill="#FFFFFF"/>
    <rect x="13" y="18" width="6" height="6" fill="#b4473d"/>
  </g>

  <!-- oversized wordmark -->
  <text x="280" y="286" font-family="'Helvetica Neue', Arial, system-ui, sans-serif" font-size="120" font-weight="700" letter-spacing="-2" fill="#202020">NOTE-LM</text>

  <!-- title under the structural rule -->
  <text x="96" y="530" font-family="'Helvetica Neue', Arial, system-ui, sans-serif" font-size="40" font-weight="700" letter-spacing="-0.5" fill="#202020">FORSCHUNGSNOTIZBUCH</text>
  <text x="96" y="572" font-family="'Helvetica Neue', Arial, system-ui, sans-serif" font-size="40" font-weight="700" letter-spacing="-0.5" fill="#202020">MIT BELEGEN</text>

  <!-- metadata block, mono, flush to the right margin rule; baselines share
       the title band; the red square anchors on a grid column left of it -->
  <text x="1104" y="532" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" letter-spacing="2" fill="#202020">01 / DOKUMENTATION</text>
  <text x="1104" y="554" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" letter-spacing="2" fill="#202020">V0.1</text>
  <rect x="869.33" y="540" width="18" height="18" fill="#b4473d"/>
</svg>
