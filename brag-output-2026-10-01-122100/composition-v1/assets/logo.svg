<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="note-lm Zeichen: Seitenblock mit Belegquadrat">
  <!-- note-lm mark - "page + reference" as neo-Swiss/brutalist geometry.
       The page is one raw rectangle with a dog-ear notch (sharp corners only);
       the text line is a paper knockout; the citation marker is a SOLID red
       square - the [E1] evidence idiom reduced to its smallest geometric form.
       No strokes to anti-alias away: at 16 px this is still just three blocks
       (ink page / paper line / red square), which is the legibility contract.
       Hand-authored vector, no raster or AI-generation step (see README.md).
       Check render: docs/design/brand/previews/ (check-sheet.png). -->
  <!-- page: raw rectangle, dog-ear notch top-right, corner radius 0 -->
  <path d="M8 4H17l7 7V28H8Z" fill="#202020"/>
  <!-- text line as negative space -->
  <rect x="11" y="12" width="10" height="3" fill="#FFFFFF"/>
  <!-- citation marker: solid red square, the single accent -->
  <rect x="13" y="18" width="6" height="6" fill="#b4473d"/>
</svg>
